name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the details below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened. Include screenshots or error logs if applicable.
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version / Commit
      description: Version, commit hash, or branch you're using.
    validations:
      required: false

  - type: dropdown
    id: openapi-version
    attributes:
      label: OpenAPI Version
      description: Version of the OpenAPI spec you're using.
      options:
        - "3.0.x"
        - "3.1.x"
        - Not applicable
    validations:
      required: false

  - type: textarea
    id: spec-snippet
    attributes:
      label: Relevant Spec Snippet
      description: A minimal OpenAPI snippet that reproduces the issue, if applicable.
      render: yaml
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, browser (if applicable).
      placeholder: |
        - OS: e.g. macOS 15
        - Node.js: e.g. 20.9.0
        - Browser: e.g. Chrome 128
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context about the problem.
    validations:
      required: false
